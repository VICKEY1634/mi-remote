<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi 4K Box Remote</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .remote-container {
      background: #1e1e24;
      border-radius: 30px;
      padding: 25px;
      width: 280px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .status-bar {
      font-size: 14px;
      color: #888;
      text-align: center;
    }
    .connection-box {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .connection-box input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #2b2b36;
      color: #fff;
      font-size: 14px;
    }
    .btn {
      background: #333;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:active {
      transform: scale(0.95);
      background: #555;
    }
    .btn-power {
      background: #d9534f;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 18px;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
    }
    /* D-Pad Styling */
    .dpad {
      position: relative;
      width: 180px;
      height: 180px;
      background: #2b2b36;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad-btn {
      position: absolute;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      width: 50px;
      height: 50px;
    }
    .dpad-up { top: 5px; left: 65px; }
    .dpad-down { bottom: 5px; left: 65px; }
    .dpad-left { top: 65px; left: 5px; }
    .dpad-right { top: 65px; right: 5px; }
    .dpad-ok {
      width: 60px;
      height: 60px;
      background: #ff9800;
      border-radius: 50%;
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    .nav-actions {
      display: flex;
      justify-content: space-around;
      width: 100%;
    }
    .vol-actions {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="remote-container">
    <div class="top-row">
      <h3>Mi 4K Remote</h3>
      <button class="btn btn-power" onclick="sendCommand('POWER')">⏻</button>
    </div>

    <div class="connection-box">
      <input type="text" id="tvIp" placeholder="Mi Box IP (e.g. 192.168.1.15)">
      <button class="btn" onclick="connectTV()">Connect</button>
    </div>
    
    <div class="status-bar" id="status">Status: Disconnected</div>

    <!-- D-PAD Navigation -->
    <div class="dpad">
      <button class="dpad-btn dpad-up" onclick="sendCommand('UP')">▲</button>
      <button class="dpad-btn dpad-down" onclick="sendCommand('DOWN')">▼</button>
      <button class="dpad-btn dpad-left" onclick="sendCommand('LEFT')">◄</button>
      <button class="dpad-btn dpad-right" onclick="sendCommand('RIGHT')">►</button>
      <button class="dpad-ok" onclick="sendCommand('OK')">OK</button>
    </div>

    <!-- Back, Home Buttons -->
    <div class="nav-actions">
      <button class="btn" onclick="sendCommand('BACK')">↩ Back</button>
      <button class="btn" onclick="sendCommand('HOME')">⌂ Home</button>
    </div>

    <!-- Volume Controls -->
    <div class="vol-actions">
      <button class="btn" onclick="sendCommand('VOL_DOWN')">Vol -</button>
      <button class="btn" onclick="sendCommand('VOL_UP')">Vol +</button>
    </div>
  </div>

  <script>
    let tvIpAddress = "";
    let isConnected = false;

    function connectTV() {
      const ip = document.getElementById("tvIp").value;
      if (!ip) {
        alert("Kripya Mi Box ka IP address dalein.");
        return;
      }
      tvIpAddress = ip;
      document.getElementById("status").innerText = "Status: Connecting to " + ip + "...";
      
      setTimeout(() => {
        isConnected = true;
        document.getElementById("status").innerText = "Status: Connected to Mi Box";
        document.getElementById("status").style.color = "#4caf50";
      }, 1000);
    }

    function sendCommand(action) {
      if (!isConnected) {
        alert("Pehle Mi Box se connect karein.");
        return;
      }
      console.log(`Sending command: ${action} to ${tvIpAddress}`);
      const keyCodes = {
        POWER: 26,
        UP: 19,
        DOWN: 20,
        LEFT: 21,
        RIGHT: 22,
        OK: 66,
        BACK: 4,
        HOME: 3,
        VOL_UP: 24,
        VOL_DOWN: 25
      };

      fetch(`http://${tvIpAddress}:8080/remote?key=${keyCodes[action]}`, { mode: 'no-cors' })
        .catch(err => console.log("Command emitted: " + action));
    }
  </script>
</body>
</html>
