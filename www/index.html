<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Box Remote</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .config-box {
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            width: 200px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            background-color: #6200ee;
            color: white;
            cursor: pointer;
            margin-left: 5px;
        }
        button:active {
            background-color: #3700b3;
        }
        .remote-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 320px;
            margin: 0 auto;
        }
        .btn-remote {
            padding: 20px;
            font-size: 18px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-remote:active {
            background-color: #555;
        }
        .wide {
            grid-column: span 3;
        }
    </style>
</head>
<body>

    <h2>Mi Box Remote</h2>
    
    <div class="config-box">
        <input type="text" id="ipInput" placeholder="Enter Mi Box IP">
        <button onclick="saveIp()">Save IP</button>
    </div>

    <div class="remote-grid">
        <button class="btn-remote wide" onclick="sendKey('HOME')">HOME</button>
        <button class="btn-remote" onclick="sendKey('BACK')">BACK</button>
        <button class="btn-remote" onclick="sendKey('UP')">UP</button>
        <button class="btn-remote" onclick="sendKey('SELECT')">OK</button>
        <button class="btn-remote" onclick="sendKey('LEFT')">LEFT</button>
        <button class="btn-remote" onclick="sendKey('DOWN')">DOWN</button>
        <button class="btn-remote" onclick="sendKey('RIGHT')">RIGHT</button>
        <button class="btn-remote" onclick="sendKey('VOLUME_UP')">VOL +</button>
        <button class="btn-remote" onclick="sendKey('VOLUME_DOWN')">VOL -</button>
        <button class="btn-remote" onclick="sendKey('POWER')">POWER</button>
    </div>

    <script>
        // Page load hote hi saved IP box me bhar jayega
        window.onload = function() {
            const savedIp = localStorage.getItem('mi_box_ip');
            if (savedIp) {
                document.getElementById('ipInput').value = savedIp;
            }
        };

        function saveIp() {
            const ip = document.getElementById('ipInput').value;
            if (ip) {
                localStorage.setItem('mi_box_ip', ip);
                alert('IP Saved Successfully: ' + ip);
            } else {
                alert('Pehle IP address daalein!');
            }
        }

        function sendKey(action) {
            const ip = localStorage.getItem('mi_box_ip');
            if (!ip) {
                alert('Pehle IP address save karein!');
                return;
            }
            // Yahan aap apna backend bridge ya command execution URL connect kar sakte hain
            console.log("Sending " + action + " to IP: " + ip);
            alert("Command sent: " + action);
        }
    </script>

</body>
</html>
